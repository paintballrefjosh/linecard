[package]
name = "linecard-vault"
description = "Linecard credential vault: OS keychain storage, optional encrypted sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Synced vault: passphrase -> key, then XChaCha20-Poly1305 per password.
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.22"
getrandom = "0.2"

# OS keychain: Windows Credential Manager / macOS Keychain / kernel keyutils.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

