[package]
name = "linecard-proto"
description = "Linecard session drivers (SSH, Telnet, Serial, RDP, VNC) behind one Session trait"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linecard-core-model = { workspace = true }
tokio = { workspace = true }
# `ring` instead of the default aws-lc-rs backend: no CMake/NASM needed to
# build on Windows, and ring is already in the tree via rustls.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
# No default features: skips libudev on Linux (port names still list).
serialport = { version = "4", default-features = false }
# VNC: password auth (DES) and ZRLE (zlib).
des = "0.9"
aes = "0.9"
md-5 = "0.11"
num-bigint = "0.5"
getrandom = "0.4"
flate2 = "1"
# RDP (IronRDP): NLA over TLS.
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-pdu = "0.11"
ironrdp-core = { version = "0.3", features = ["alloc"] }
ironrdp-tokio = "0.12"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-cliprdr = "0.9"
# Device redirection: the (empty) channel every session offers, and Windows folder sharing.
ironrdp-rdpdr = "0.9"
ironrdp-rdpsnd = "0.11"
x509-cert = { version = "0.3", features = ["std"] }
sha2 = "0.11"
# VNC's VeNCrypt (TLS); ring like the rest, no CMake/NASM.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.23"
# HMAC-SHA1 for hashed known_hosts names (ring is already in the tree).
ring = "0.17"
# SFTP client (independent of russh; works over any stream).
russh-sftp = "3"
# Local shell tabs: ConPTY on Windows, a pseudo-terminal elsewhere (from WezTerm).
portable-pty = "0.9"


# RDP's TLS. On Windows, the system's (SChannel, as mstsc uses): older hosts
# such as Windows 7 only speak TLS 1.0, which rustls doesn't. Elsewhere rustls
# with ring (not aws-lc: no CMake/NASM needed).
[target.'cfg(windows)'.dependencies]
ironrdp-tls = { version = "0.3", features = ["native-tls"] }
# Sharing a folder of this computer with the remote one (Windows only so far).
ironrdp-rdpdr-native = "0.9"

[target.'cfg(not(windows))'.dependencies]
ironrdp-tls = { version = "0.3", features = ["rustls-ring"] }

[dev-dependencies]
tempfile = "3"
ironrdp-svc = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
