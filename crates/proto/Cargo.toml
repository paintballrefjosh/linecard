[package]
name = "linecard-proto"
description = "Linecard session drivers (SSH, Telnet, Serial, RDP, VNC) behind one Session trait"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linecard-core-model = { workspace = true }
tokio = { workspace = true }
# `ring` instead of the default aws-lc-rs backend: no CMake/NASM needed to
# build on Windows, and ring is already in the tree via rustls.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
# No default features: skips libudev on Linux (port names still list).
serialport = { version = "4", default-features = false }
# VNC: password auth (DES) and ZRLE (zlib).
des = "0.8"
flate2 = "1"

# Added as each driver lands (see docs/roadmap.md):
# ironrdp = "..."         # RDP on macOS/Linux
# windows = { version = "...", features = [...] }  # native RDP ActiveX host on Windows
