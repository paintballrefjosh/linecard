[package]
name = "linecard-importers"
description = "Import saved sessions from SecureCRT, mRemoteNG, SuperPuTTY, PuTTY and ssh_config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
linecard-core-model = { workspace = true }
roxmltree = "0.21"   # mRemoteNG confCons.xml

[target.'cfg(windows)'.dependencies]
winreg = "0.56"      # PuTTY keeps sessions in the registry
