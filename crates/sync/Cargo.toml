[package]
name = "linecard-sync"
description = "Linecard sync: pairing phrases, end-to-end encrypted op batches, folder and relay transports"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
bip39 = "2"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
hkdf = "0.12"
linecard-core-sync = { workspace = true, features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# WebSocket push from the relay; TLS with the system's trust store, as reqwest does.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = "2"
# LAN sync: each computer serves its store with the relay protocol.
linecard-relay = { path = "../../relay" }
axum = "0.8"
tokio = { workspace = true }
socket2 = "0.6"

[dev-dependencies]
