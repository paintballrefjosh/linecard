# Linecard relay with automatic HTTPS.
#
#   1. Point a DNS name at this server and open ports 80 and 443.
#   2. cp .env.example .env   and set RELAY_DOMAIN
#   3. docker compose up -d
#
# Then enter https://<RELAY_DOMAIN> in Linecard → Settings → Sync → Relay.
# Admin commands:  docker compose exec relay linecard-relay stats

name: linecard-relay

services:
  relay:
    image: ghcr.io/paintballrefjosh/linecard-relay:${RELAY_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    environment:
      LINECARD_RELAY_OPEN: ${LINECARD_RELAY_OPEN:-true}
      LINECARD_RELAY_MAX_OPS: ${LINECARD_RELAY_MAX_OPS:-200000}
      LINECARD_RELAY_MAX_GROUP_BYTES: ${LINECARD_RELAY_MAX_GROUP_BYTES:-256MiB}
      LINECARD_RELAY_IDLE_DAYS: ${LINECARD_RELAY_IDLE_DAYS:-0}
      # A backup of the database every day, the newest few kept (see README: copy them off this server).
      LINECARD_RELAY_BACKUP_DIR: ${LINECARD_RELAY_BACKUP_DIR:-/backups}
      LINECARD_RELAY_BACKUP_KEEP: ${LINECARD_RELAY_BACKUP_KEEP:-7}
      # Limits per client address and per sync group; "off" turns them off.
      LINECARD_RELAY_RATE: ${LINECARD_RELAY_RATE:-20/s, burst 100}
      # The relay is reachable only through Caddy, which sets X-Forwarded-For to the real client address.
      LINECARD_RELAY_TRUST_PROXY: "true"
      LINECARD_RELAY_LOG: ${LINECARD_RELAY_LOG:-info}
      LINECARD_RELAY_LOG_FORMAT: ${LINECARD_RELAY_LOG_FORMAT:-text}
      # Prometheus metrics, on a port that is not published (scrape it from another container on the backend network):
      # LINECARD_RELAY_METRICS_ADDR: 0.0.0.0:9100
    volumes:
      - relay-data:/data
      - relay-backups:/backups
    # The image defines its own health check (linecard-relay health).
    networks: [backend]
    stop_grace_period: 10s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN in .env (the DNS name of this server)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep this volume
      - caddy-config:/config
    networks: [backend, default]

networks:
  # The relay is reachable only through Caddy: no published port, and the
  # network has no route out.
  backend:
    internal: true

volumes:
  relay-data:
  relay-backups:
  caddy-data:
  caddy-config:
