[package]
name = "linecard-relay"
description = "Self-hostable Linecard sync relay: stores and forwards end-to-end encrypted ops"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "linecard_relay"
path = "src/lib.rs"

[[bin]]
name = "linecard-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, features = ["backup"] }
sha2 = "0.10"
getrandom = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
