[package]
name = "linecard"
description = "Linecard terminal and remote-desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "linecard_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
linecard-core-model = { workspace = true, features = ["serde"] }
linecard-core-sync = { workspace = true, features = ["serde"] }
linecard-core-store = { workspace = true }
linecard-vault = { workspace = true }
linecard-proto = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tauri-plugin-clipboard-manager = "2"
chrono = "0.4"
