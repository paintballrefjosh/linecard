name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build UI (Tauri embeds it at compile time)
        working-directory: app
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The relay image builds, starts healthy, takes admin commands, and stops
  # on SIGTERM well inside Docker's 10 s limit.
  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          load: true
          tags: linecard-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it
        run: |
          docker run -d --name relay -p 8443:8443 -v relay-data:/data linecard-relay:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' relay)
            [ "$s" = healthy ] && break
            sleep 2
          done
          echo "health: $s"
          [ "$s" = healthy ]
      - name: Answers over HTTP and takes admin commands
        run: |
          curl -fsS http://127.0.0.1:8443/health
          docker exec relay linecard-relay account add ci
          docker exec relay linecard-relay stats
      - name: Image is small, runs as non-root
        run: |
          size=$(docker image inspect linecard-relay:ci -f '{{.Size}}')
          echo "image size: $size bytes"
          [ "$size" -lt 20000000 ]
          [ "$(docker image inspect linecard-relay:ci -f '{{.Config.User}}')" = "65532:65532" ]
      - name: Stops gracefully
        run: |
          start=$(date +%s)
          docker stop relay
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' relay)
          echo "stopped in ${took}s, exit code $code"
          [ "$took" -lt 10 ] && [ "$code" = 0 ]
      - name: Works with a read-only root filesystem and no capabilities
        run: |
          docker run -d --name relay2 --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -p 8444:8443 -v relay-data:/data linecard-relay:ci
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8444/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8444/health
