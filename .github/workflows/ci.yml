name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  rust:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build UI (Tauri embeds it at compile time)
        working-directory: app
        run: |
          npm ci
          npm run build
          npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Known vulnerabilities, licenses and sources in the dependencies. The
  # weekly run (see `schedule` above) catches advisories published after the last push.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: UI dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=moderate

  # The relay image builds, starts healthy, takes admin commands, and stops
  # on SIGTERM well inside Docker's 10 s limit.
  relay-image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: relay/Dockerfile
          load: true
          tags: linecard-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run it
        run: |
          docker run -d --name relay -p 8443:8443 -v relay-data:/data linecard-relay:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' relay)
            [ "$s" = healthy ] && break
            sleep 2
          done
          echo "health: $s"
          [ "$s" = healthy ]
      - name: Answers over HTTP and takes admin commands
        run: |
          curl -fsS http://127.0.0.1:8443/health
          curl -fsS http://127.0.0.1:8443/ready
          docker exec relay linecard-relay config
          docker exec relay linecard-relay account add ci
          docker exec relay linecard-relay stats
      - name: Image is small, runs as non-root
        run: |
          size=$(docker image inspect linecard-relay:ci -f '{{.Size}}')
          echo "image size: $size bytes"
          [ "$size" -lt 20000000 ]
          [ "$(docker image inspect linecard-relay:ci -f '{{.Config.User}}')" = "65532:65532" ]
      - name: Backs up while serving
        run: |
          docker exec relay linecard-relay backup /data/ci-backup.db
      - name: Stops gracefully
        run: |
          start=$(date +%s)
          docker stop relay
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' relay)
          echo "stopped in ${took}s, exit code $code"
          [ "$took" -lt 10 ] && [ "$code" = 0 ]
      - name: Restores a backup into the stopped relay's volume
        run: |
          docker run --rm -v relay-data:/data linecard-relay:ci restore /data/ci-backup.db
      - name: Works with a read-only root filesystem and no capabilities
        run: |
          docker run -d --name relay2 --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -p 8444:8443 -v relay-data:/data linecard-relay:ci
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8444/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8444/health
      - name: The Compose bundle comes up and proxies the relay
        working-directory: relay/deploy
        run: |
          docker tag linecard-relay:ci ghcr.io/paintballrefjosh/linecard-relay:ci
          printf 'RELAY_DOMAIN=:80\nRELAY_VERSION=ci\n' > .env
          docker compose config -q
          docker pull caddy:2
          docker compose up -d --pull never
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1/health && break; sleep 2; done
          curl -fsS http://127.0.0.1/health
          docker compose exec -T relay linecard-relay stats
          docker compose exec -T relay linecard-relay backup /backups/
          docker compose down -v
