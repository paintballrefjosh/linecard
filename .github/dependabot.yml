version: 2
# Minor and patch updates arrive as PRs. Major versions of libraries are left
# for a hands-on upgrade (the UI libraries and the RustCrypto family must
# move together), so they are not proposed.
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /app
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /relay
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
