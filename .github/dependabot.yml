version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /app
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /relay
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
