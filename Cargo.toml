[workspace]
resolver = "2"
members = [
    "crates/core-model",
    "crates/core-sync",
    "crates/core-store",
    "crates/proto",
    "crates/importers",
    "crates/vault",
    "crates/sync",
    "app/src-tauri",
    "relay",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paintballrefjosh/linecard"
rust-version = "1.89"  # russh

[workspace.dependencies]
linecard-core-model = { path = "crates/core-model" }
linecard-core-sync = { path = "crates/core-sync" }
linecard-core-store = { path = "crates/core-store" }
linecard-proto = { path = "crates/proto" }
linecard-importers = { path = "crates/importers" }
linecard-vault = { path = "crates/vault" }
linecard-sync = { path = "crates/sync" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
