# Dependency policy, checked in CI by cargo-deny.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # IronRDP -> sspi -> winscard -> iso7816 -> heapless. Unmaintained, no vulnerability; waiting on IronRDP.
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill: unmaintained, via IronRDP" },
    # IronRDP -> sspi -> async-dnssd -> pin-utils. Unmaintained, no vulnerability; waiting on IronRDP.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: unmaintained, via IronRDP" },
    # Tauri's GTK3 stack (Linux only). Unmaintained, no vulnerability; goes when Tauri leaves GTK3.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, via Tauri/GTK3 (Linux)" },
    # IronRDP -> picky -> rsa (CredSSP). Timing side channel on RSA private-key use over the network;
    # no fixed release exists. Linecard only runs the client side of a login the user started.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack: no fix upstream, via IronRDP" },
    # tauri-plugin-opener and -single-instance (Linux D-Bus). Unmaintained notices only.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, via Tauri plugins (Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, via Tauri plugins (Linux)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, via Tauri plugins (Linux)" },
]

[licenses]
version = 2
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0", "Unlicense", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
